# UWAGA: plik celowo nazywa się deployment.yaml, mimo że zawiera Rollout
# (Argo Rollouts) - workflow promocji podmienia w nim linię "image:" po nazwie
# pliku. Canary: 50% ruchu -> pauza 60s -> pełny rollout.
# Wymaga kontrolera argo-rollouts (instalowany przez platform-apps na PROD).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: adrian-java-app
  labels:
    app: adrian-java-app
spec:
  # replicas zarządza HPA (hpa.yaml), minimum 2 pody
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 50
        - pause:
            duration: 60s
  selector:
    matchLabels:
      app: adrian-java-app
  template:
    metadata:
      labels:
        app: adrian-java-app
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adrian-java-app
          image: acrfordevopspoc01adrian.azurecr.io/adrian-java-app:1.0.1
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx256m"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
